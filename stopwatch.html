<style>
  :root {
    --page: #f3e4e1;
    --page2: #e7c9c4;
    --text: #3a2326;
    --muted: #8a6a6d;
    --shell: #d4d1c9;
    --shell2: #c1beb6;
    --bezel: #5d6075;
    --navy: #2b2f7a;
    --berry: #a3194f;
    --pixel: "Galmuri11", "Galmuri9", "DungGeunMo", "Malgun Gothic", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #1d1214;
      --page2: #2c1a1d;
      --text: #f1dfe0;
      --muted: #a88a8d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 0%, var(--page2), var(--page) 70%);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding: 32px 16px 48px;
  }

  /* ───── 게임보이 본체 ───── */
  .gb {
    position: relative;
    width: min(100%, 360px);
    padding: 0 22px 120px;
    background: linear-gradient(160deg, var(--shell), var(--shell2));
    border-radius: 12px 12px 72px 12px;
    box-shadow:
      inset -5px -5px 0 rgba(0, 0, 0, 0.08),
      inset 4px 4px 0 rgba(255, 255, 255, 0.5),
      0 24px 50px rgba(60, 10, 20, 0.35);
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .gb-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 30px;
    margin: 0 -22px 18px;
    padding: 0 22px;
    border-bottom: 2px solid rgba(0, 0, 0, 0.1);
    font-size: 10px;
    letter-spacing: 1px;
    color: #8f8c86;
  }
  .gb-top b { color: var(--berry); }

  .bezel {
    background: var(--bezel);
    border-radius: 10px 10px 44px 10px;
    padding: 10px 14px 20px;
    box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
  }
  .bezel-title {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 10px;
    font-size: 8px;
    letter-spacing: 0.5px;
    color: #c9c9d6;
    white-space: nowrap;
  }
  .bezel-title i {
    flex: 1;
    height: 7px;
    border-top: 2px solid var(--berry);
    border-bottom: 2px solid var(--navy);
  }
  .bezel-body {
    display: grid;
    grid-template-columns: 26px 1fr;
    align-items: center;
  }
  .led-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-size: 6px;
    color: #c9c9d6;
    transform: translateX(-4px);
  }
  .led {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #3d1015;
    transition: background 0.2s, box-shadow 0.2s;
  }
  .led.on {
    background: #ff3030;
    box-shadow: 0 0 8px 2px rgba(255, 50, 50, 0.7);
  }

  .screen {
    position: relative;
    aspect-ratio: 160 / 144;
    container-type: inline-size;
    background: #000;
    box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.35);
    overflow: hidden;
  }
  .screen canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }
  .msg {
    position: absolute;
    left: 5%;
    right: 8%;
    top: 84.2%;
    bottom: 2%;
    font-family: var(--pixel);
    font-size: 5cqw;
    line-height: 1.22;
    font-weight: 700;
    color: var(--c3);
    word-break: keep-all;
    overflow: hidden;
  }
  .sign {
    position: absolute;
    top: 3%;
    left: 3%;
    padding: 1.6cqw 3cqw;
    font-family: var(--pixel);
    font-size: 4.8cqw;
    font-weight: 700;
    color: var(--c3);
    background: var(--c0);
    border: 0.9cqw solid var(--c3);
    box-shadow: inset 0 0 0 0.7cqw var(--c0), inset 0 0 0 1.3cqw var(--c2);
    opacity: 0;
    transform: translateY(-30%);
    transition: opacity 0.25s, transform 0.25s;
  }
  .sign.show { opacity: 1; transform: none; }

  .logo {
    margin: 12px 0 0 4px;
    font: italic 900 19px/1 "Arial Black", "Segoe UI", sans-serif;
    color: var(--navy);
    letter-spacing: -0.5px;
  }
  .logo em {
    font-style: italic;
    color: #c8141f;
    font-size: 15px;
    margin-left: 4px;
    letter-spacing: 1px;
  }

  /* ───── 버튼 ───── */
  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 34px;
  }
  .dpad {
    position: relative;
    width: 90px;
    height: 90px;
    flex: none;
  }
  .dpad::before {
    content: "";
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.07);
  }
  .dpad button {
    position: absolute;
    width: 30px;
    height: 30px;
    padding: 0;
    border: none;
    background: #2b2b31;
    cursor: pointer;
    box-shadow: 0 3px 0 #111;
  }
  .dpad .up    { left: 30px; top: 0;     border-radius: 4px 4px 0 0; }
  .dpad .down  { left: 30px; top: 60px;  border-radius: 0 0 4px 4px; }
  .dpad .left  { left: 0;    top: 30px;  border-radius: 4px 0 0 4px; }
  .dpad .right { left: 60px; top: 30px;  border-radius: 0 4px 4px 0; }
  .dpad .mid   { left: 30px; top: 30px;  cursor: default; }
  .dpad .mid::after {
    content: "";
    position: absolute;
    inset: 8px;
    border-radius: 50%;
    background: radial-gradient(#1b1b20, #2b2b31);
  }
  .dpad .up::after, .dpad .down::after, .dpad .left::after, .dpad .right::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    border: 5px solid transparent;
    transform: translate(-50%, -50%);
  }
  .dpad .up::after    { border-bottom-color: #47474f; margin-top: -3px; }
  .dpad .down::after  { border-top-color: #47474f; margin-top: 3px; }
  .dpad .left::after  { border-right-color: #47474f; margin-left: -3px; }
  .dpad .right::after { border-left-color: #47474f; margin-left: 3px; }
  .dpad button:active, .dpad button.pressed { box-shadow: 0 1px 0 #111; transform: translateY(2px); }

  .ab {
    display: flex;
    gap: 16px;
    padding: 8px 10px;
    border-radius: 40px;
    background: rgba(0, 0, 0, 0.07);
    transform: rotate(-25deg);
  }
  .ab-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .ab-btn:first-child { margin-top: 0; }
  .round {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: none;
    background: radial-gradient(circle at 35% 30%, #c8306a, var(--berry) 60%, #7c1239);
    box-shadow: 0 4px 0 #5a0d29, 0 6px 8px rgba(0, 0, 0, 0.25);
    cursor: pointer;
  }
  .round:active, .round.pressed { transform: translateY(3px); box-shadow: 0 1px 0 #5a0d29; }
  .ab-btn span, .ss-btn span {
    font: italic 800 13px/1 "Arial Black", sans-serif;
    color: var(--navy);
  }

  .ss {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 38px;
    margin-right: 30px;
  }
  .ss-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    transform: rotate(-25deg);
  }
  .ss-btn span { font-size: 9px; letter-spacing: 1px; }
  .pill {
    width: 44px;
    height: 12px;
    border-radius: 8px;
    border: 2px solid rgba(0, 0, 0, 0.15);
    background: #8b8b92;
    box-shadow: 0 2px 0 #5d5d63;
    cursor: pointer;
  }
  .pill:active, .pill.pressed { transform: translateY(2px); box-shadow: none; }

  .speaker {
    position: absolute;
    right: 28px;
    bottom: 30px;
    display: flex;
    gap: 6px;
    transform: rotate(-28deg);
  }
  .speaker i {
    width: 6px;
    height: 48px;
    border-radius: 3px;
    background: #a29e96;
    box-shadow: inset 1px 2px 2px rgba(0, 0, 0, 0.35);
  }

  /* ───── 안내 & 기록 ───── */
  .hint {
    max-width: 360px;
    margin: 0;
    text-align: center;
    font-size: 12px;
    line-height: 1.7;
    color: var(--muted);
  }
  .hint kbd {
    padding: 1px 5px;
    border-radius: 4px;
    border: 1px solid currentColor;
    font: 11px monospace;
  }
  .log {
    width: min(100%, 360px);
    padding: 14px 18px;
    background: #fbfbf6;
    color: #24242a;
    border: 3px solid #24242a;
    border-radius: 6px;
    box-shadow: inset 0 0 0 3px #fbfbf6, inset 0 0 0 5px #24242a;
    font-family: var(--pixel);
  }
  .log h2 { margin: 2px 0 8px; font-size: 15px; }
  .log ol { margin: 0; padding: 0; list-style: none; max-height: 240px; overflow-y: auto; }
  .log li {
    display: grid;
    grid-template-columns: 44px 1fr auto;
    gap: 8px;
    padding: 6px 0;
    border-top: 1px dashed #b9b9b0;
    font-size: 13px;
    font-variant-numeric: tabular-nums;
  }
  .log li small { color: #77776f; }
  .log .empty { color: #77776f; font-size: 13px; }
</style>
</head>

  </p>

    <ol id="laps"></ol>
    <p class="empty" id="empty">달리는 중에 B를 누르면 랩이 기록돼요.</p>

  snorlax:    { names: ['잠만보'], sprites: [S.snorlax] },
};
const ORDER  = ['pikachu', 'caterpie', 'charmander', 'squirtle', 'bulbasaur', 'snorlax'];
const MEET_T = [4, 33, 62, 96, 130, 165];               // 만나는 시각(초)
const EVO_T  = [75, 112, 150, 185, 210, 235, 260, 285]; // 진화가 일어나는 시각(초)
const MEET_DUR = 4, EVO_DUR = 5;

/* 진화 순서를 랜덤으로 정한다 (각 계열 안에서는 1단계 → 2단계 순서 유지) */
function buildSchedule() {
  const events = ORDER.map((line, i) => ({ type: 'meet', t: MEET_T[i], dur: MEET_DUR, line }));
  const left = { caterpie: 2, charmander: 2, squirtle: 2, bulbasaur: 2 };
  for (const t of EVO_T) {
    const ok = Object.keys(left).filter(l => left[l] > 0 && MEET_T[ORDER.indexOf(l)] + MEET_DUR <= t);
    const line = ok[Math.floor(Math.random() * ok.length)];
    const from = 2 - left[line];
    left[line]--;
    events.push({ type: 'evo', t, dur: EVO_DUR, line, from });
  }
  return events.sort((a, b) => a.t - b.t);
}

/* ═════════ 한국어 조사 ═════════ */
function josa(word, pair) {
  const code = word.charCodeAt(word.length - 1) - 0xac00;
  const jong = code >= 0 && code <= 11171 ? code % 28 : 0;
  if (pair === '으로/로') return word + (jong === 0 || jong === 8 ? '로' : '으로');
  const [withJong, without] = pair.split('/');
  return word + (jong ? withJong : without);
}

/* ═════════ 상태 ═════════ */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const screenEl = document.getElementById('screen');
const msgEl = document.getElementById('msg');
const signEl = document.getElementById('sign');
const ledEl = document.getElementById('led');
const lapList = document.getElementById('laps');
const emptyEl = document.getElementById('empty');

let pal = 0;
let running = false;
let startTime = 0;
let elapsed = 0;
let lapStart = 0;
let laps = [];
let schedule = buildSchedule();
let toast = null;
let lastArea = -1;
let signTimer = null;
let lastMsg = '';

function now() {
  return running ? elapsed + (performance.now() - startTime) : elapsed;
}

function formatTime(ms) {
  const totalCs = Math.floor(ms / 10);
  const cs = totalCs % 100;
  const totalSec = Math.floor(totalCs / 100);
  const s = totalSec % 60;
  const m = Math.floor(totalSec / 60) % 60;
  const h = Math.floor(totalSec / 3600);
  const pad = n => String(n).padStart(2, '0');
  return (h ? h + ':' + pad(m) : pad(m)) + ':' + pad(s) + '.' + pad(cs);
}

function areaAt(wx) {
  return wx < 0 ? 0 : Math.floor(wx / AREA_LEN) % AREAS.length;
}

/* 경과 시간 t(초)로부터 여행 상태를 계산한다. 이벤트 중에는 레드가 멈춰 선다. */
function getState(t) {
  let walk = t;
  let cur = null;
  for (const e of schedule) {
    if (t > e.t) walk -= Math.min(t - e.t, e.dur);
    if (t >= e.t && t < e.t + e.dur) cur = e;
  }
  const party = ORDER.filter((l, i) => t >= MEET_T[i] + 2).map(line => ({
    line,
    stage: schedule.filter(e => e.type === 'evo' && e.line === line && t >= e.t + 3).length,
  }));
  const wx = walk * SPEED;
  return { walk, wx, cur, phase: cur ? t - cur.t : 0, party, area: areaAt(wx), loop: Math.floor(wx / (AREA_LEN * AREAS.length)) };
}

/* ═════════ 그리기 도구 ═════════ */
function col(i) { return PALETTES[pal].c[i]; }
function r(x, y, w, h, i) {
  ctx.fillStyle = col(i);
  ctx.fillRect(x, y, w, h);
}
function disc(cx, cy, rad, i) {
  for (let dy = -rad; dy <= rad; dy++) {
    const w = Math.floor(Math.sqrt(rad * rad - dy * dy));
    r(cx - w, cy + dy, w * 2 + 1, 1, i);
  }
}
function hash(n) {
  n = Math.imul(n ^ 0x5bd1e995, 0x27d4eb2d);
  n ^= n >>> 15;
  n = Math.imul(n, 0x165667b1);
  n ^= n >>> 13;
  return (n >>> 0) / 4294967296;
}
function drawSprite(rows, cx, footY, silhouette) {
  const w = Math.max(...rows.map(s => s.length));
  const x0 = Math.round(cx - w / 2), y0 = footY - rows.length;
  for (let y = 0; y < rows.length; y++) {
    for (let x = 0; x < rows[y].length; x++) {
      const ch = rows[y][x];
      if (ch === '.') continue;
      r(x0 + x, y0 + y, 1, 1, silhouette ? (ch === '3' ? 3 : 0) : +ch);
    }
  }
}

/* 5×7 비트맵 숫자 */
const GLYPHS = {
  '0': ['01110', '10001', '10011', '10101', '11001', '10001', '01110'],
  '1': ['00100', '01100', '00100', '00100', '00100', '00100', '01110'],
  '2': ['01110', '10001', '00001', '00010', '00100', '01000', '11111'],
  '3': ['11110', '00001', '00001', '01110', '00001', '00001', '11110'],
  '4': ['00010', '00110', '01010', '10010', '11111', '00010', '00010'],
  '5': ['11111', '10000', '11110', '00001', '00001', '10001', '01110'],
  '6': ['00110', '01000', '10000', '11110', '10001', '10001', '01110'],
  '7': ['11111', '00001', '00010', '00100', '01000', '01000', '01000'],
  '8': ['01110', '10001', '10001', '01110', '10001', '10001', '01110'],
  '9': ['01110', '10001', '10001', '01111', '00001', '00010', '01100'],
  ':': ['0', '1', '1', '0', '1', '1', '0'],
  '.': ['0', '0', '0', '0', '0', '1', '1'],
};
function textWidth(str, sc) {
  return [...str].reduce((w, ch) => w + (GLYPHS[ch][0].length + 1) * sc, -sc);
}
function drawText(str, x, y, sc, i) {
  for (const ch of str) {
    const g = GLYPHS[ch];
    g.forEach((row, gy) => {
      for (let gx = 0; gx < row.length; gx++) if (row[gx] === '1') r(x + gx * sc, y + gy * sc, sc, sc, i);
    });
    x += (g[0].length + 1) * sc;
  }
}

/* ═════════ 지역 배경 ═════════ */
function ridge(wx) {
  const tri = u => Math.abs(2 * (u - Math.floor(u)) - 1);
  return Math.round(18 + 16 * tri(wx / 90) + 7 * tri(wx / 31 + 0.3));
}

function drawBg(type, c, sx, rt) {
  switch (type) {
    case 'town':
      r(sx, 0, 16, 72, 0);
      r(sx, 72, 16, 8, 1);
      if (hash(c) > 0.4) { r(sx + 3, 74, 1, 3, 2); r(sx + 5, 73, 1, 4, 2); r(sx + 7, 74, 1, 3, 2); }
      r(sx, 80, 16, 1, 2);
      r(sx, 81, 16, 19, 0);
      if (hash(c * 7) > 0.6) r(sx + Math.floor(hash(c * 3) * 12), 86 + Math.floor(hash(c * 5) * 10), 2, 1, 1);
      break;
    case 'forest':
      r(sx, 0, 16, 72, 1);
      r(sx, 0, 16, 6, 3);
      r(sx, 72, 16, 8, 2);
      for (let k = 1; k < 16; k += 4) r(sx + k, 70 + (k % 3), 2, 3, 3);
      r(sx, 80, 16, 1, 3);
      r(sx, 81, 16, 19, 0);
      if (hash(c * 11) > 0.5) r(sx + Math.floor(hash(c) * 12), 84 + Math.floor(hash(c * 9) * 12), 2, 2, 1);
      break;
    case 'city':
      r(sx, 0, 16, 72, 0);
      r(sx, 72, 16, 8, 0);
      r(sx, 72, 16, 1, 2);
      r(sx + 7, 72, 1, 8, 1);
      r(sx + 15, 72, 1, 8, 1);
      r(sx, 80, 16, 1, 3);
      r(sx, 81, 16, 19, 1);
      if (c % 2 === 0) r(sx + 3, 97, 10, 1, 0);
      break;
    case 'sea':
      r(sx, 0, 16, 40, 0);
      r(sx, 40, 16, 1, 2);
      r(sx, 41, 16, 59, 1);
      for (let y = 46; y < 100; y += 8) {
        const off = (Math.floor(rt * 5) + y * 3 + c * 7) % 16;
        r(sx + off, y, 3, 1, 2);
        r(sx + ((off + 8) % 16), y + 4, 2, 1, 0);
      }
      break;
    case 'port':
      r(sx, 0, 16, 40, 0);
      r(sx, 40, 16, 1, 2);
      r(sx, 41, 16, 23, 1);
      for (let y = 45; y < 64; y += 7) r(sx + (Math.floor(rt * 5) + y + c * 5) % 14, y, 3, 1, 2);
      r(sx, 64, 16, 3, 2);
      r(sx, 67, 16, 33, 0);
      for (let y = 72; y < 100; y += 7) {
        r(sx, y, 16, 1, 1);
        r(sx + ((c + y) % 2 ? 3 : 11), y - 6, 1, 6, 1);
      }
      break;
    case 'mountain':
    case 'mtntown':
      r(sx, 0, 16, 64, 0);
      for (let px = 0; px < 16; px++) {
        const h = ridge(c * 16 + px);
        r(sx + px, h, 1, 64 - h, 1);
        r(sx + px, h, 1, 1, 3);
        if (h < 30) r(sx + px, h + 1, 1, 31 - h, 0);
        if ((c * 16 + px) % 9 === 0) r(sx + px, h + 8, 1, 64 - h - 8, 2);
      }
      r(sx, 64, 16, 16, 1);
      if (hash(c * 13) > 0.4) r(sx + Math.floor(hash(c) * 13), 67 + Math.floor(hash(c * 2) * 10), 2, 1, 2);
      r(sx, 80, 16, 1, 2);
      r(sx, 81, 16, 19, 0);
      if (hash(c * 17) > 0.6) r(sx + Math.floor(hash(c * 4) * 13), 86 + Math.floor(hash(c * 6) * 10), 2, 1, 1);
      break;
  }
}

function house(x) {
  r(x + 24, 28, 4, 8, 3);
  r(x - 1, 35, 34, 13, 3);
  r(x, 36, 32, 11, 2);
  for (let y = 38; y < 47; y += 3) r(x, y, 32, 1, 1);
  r(x + 1, 48, 30, 24, 3);
  r(x + 2, 48, 28, 23, 0);
  r(x + 12, 58, 7, 13, 3);
  r(x + 4, 52, 6, 5, 3); r(x + 5, 53, 4, 3, 1);
  r(x + 22, 52, 6, 5, 3); r(x + 23, 53, 4, 3, 1);
}
function roundTree(cx, cy) {
  r(cx - 2, cy + 6, 4, 72 - cy - 6, 3);
  disc(cx, cy, 9, 3);
  disc(cx, cy, 8, 2);
  r(cx - 4, cy - 4, 2, 2, 1);
  r(cx + 2, cy + 1, 2, 1, 1);
  r(cx - 1, cy - 1, 1, 1, 1);
}
function pine(cx, top, h, i) {
  for (let k = 0; k < h; k++) {
    const w = 1 + Math.floor((k % 10) * 0.7 + k * 0.2);
    r(cx - w, top + k, w * 2 + 1, 1, i);
  }
}
function cloud(x, y) {
  r(x + 1, y, 14, 1, 1);
  r(x, y + 1, 1, 4, 1);
  r(x + 15, y + 1, 1, 4, 1);
  r(x + 1, y + 5, 14, 1, 1);
  r(x + 1, y + 1, 14, 4, 0);
  r(x + 5, y - 2, 6, 2, 1);
  r(x + 6, y - 1, 4, 2, 0);
}

function drawObj(type, c, sx, rt) {
  switch (type) {
    case 'town': {
      const m = ((c % 6) + 6) % 6;
      if (m === 1) house(sx);
      else if (m === 4) roundTree(sx + 8, 52);
      else if (m === 0 || m === 5) {
        r(sx, 64, 16, 1, 3); r(sx, 68, 16, 1, 3);
        r(sx + 2, 61, 2, 11, 3); r(sx + 10, 61, 2, 11, 3);
      }
      if (hash(c * 19) > 0.7) cloud(sx, 8 + Math.floor(hash(c) * 12));
      if (m === 3) { r(sx + 4, 75, 2, 2, 2); r(sx + 10, 76, 2, 2, 2); r(sx + 4, 74, 2, 1, 3); }
      break;
    }
    case 'forest':
      pine(sx + 4, 4, 34, 2);
      if (hash(c) > 0.3) roundTree(sx + 8 + Math.floor(hash(c * 7) * 4) - 2, 44);
      else { disc(sx + 8, 68, 6, 3); disc(sx + 8, 68, 5, 2); r(sx + 6, 65, 2, 1, 1); }
      break;
    case 'city':
      if (c % 9 === 0) {
        // 포켓몬센터
        r(sx, 38, 44, 34, 3);
        r(sx + 1, 39, 42, 8, 2);
        r(sx + 1, 47, 42, 24, 0);
        disc(sx + 22, 43, 3, 0);
        r(sx + 19, 43, 7, 1, 3);
        r(sx + 16, 58, 12, 14, 3);
        r(sx + 17, 59, 10, 13, 1);
        r(sx + 22, 59, 1, 13, 3);
        r(sx + 4, 51, 8, 5, 1);
        r(sx + 32, 51, 8, 5, 1);
      } else if (c % 3 === 0) {
        const top = 8 + Math.floor(hash(c) * 30);
        r(sx, top, 44, 72 - top, 3);
        r(sx + 1, top + 1, 42, 71 - top, 1);
        r(sx + 1, top + 3, 42, 1, 3);
        for (let y = top + 7; y < 62; y += 7) {
          for (let x = sx + 4; x < sx + 40; x += 8) r(x, y, 4, 4, hash(c * 31 + y * 7 + x) > 0.45 ? 0 : 2);
        }
        r(sx + 18, 62, 8, 10, 3);
      }
      break;
    case 'sea':
      if (hash(c * 19) > 0.65) cloud(sx, 6 + Math.floor(hash(c) * 14));
      if (c % 11 === 5) { r(sx + 6, 34, 6, 1, 3); r(sx + 3, 35, 12, 2, 3); r(sx, 37, 18, 3, 2); }
      if (hash(c * 23) > 0.8) {
        const y = 22 + Math.floor(Math.sin(rt * 2 + c) * 2);
        r(sx + 4, y, 1, 1, 3); r(sx + 5, y + 1, 1, 1, 3); r(sx + 6, y, 1, 1, 3); r(sx + 7, y - 1, 1, 1, 3);
        r(sx + 3, y - 1, 1, 1, 3);
      }
      break;
    case 'port':
      if (c % 12 === 2) {
        // 큰 배
        r(sx + 20, 26, 7, 12, 3); r(sx + 20, 29, 7, 2, 1);
        r(sx + 34, 26, 7, 12, 3); r(sx + 34, 29, 7, 2, 1);
        r(sx + 56, 22, 1, 26, 3);
        r(sx + 8, 37, 44, 11, 3);
        r(sx + 9, 38, 42, 10, 0);
        for (let i = 0; i < 6; i++) r(sx + 12 + i * 7, 41, 4, 3, 1);
        r(sx, 48, 64, 14, 3);
        r(sx + 1, 49, 62, 12, 2);
        for (let i = 0; i < 7; i++) r(sx + 6 + i * 8, 53, 3, 3, 0);
      } else if (c % 12 === 8) {
        // 등대
        const x = sx + 4;
        r(x - 1, 12, 12, 6, 3);
        r(x + 2, 13, 6, 4, Math.floor(rt * 2) % 2 ? 0 : 1);
        r(x, 18, 10, 46, 3);
        for (let y = 19; y < 63; y += 8) { r(x + 1, y, 8, 4, 0); r(x + 1, y + 4, 8, 4, 2); }
      }
      if (c % 3 === 1) { r(sx + 6, 70, 5, 6, 3); r(sx + 7, 71, 3, 3, 2); }
      if (hash(c * 19) > 0.75) cloud(sx, 4 + Math.floor(hash(c) * 10));
      break;
    case 'mountain':
      if (c % 13 === 6) { disc(sx + 9, 54, 9, 3); r(sx, 54, 19, 10, 3); }
      if (c % 3 === 0) { disc(sx + 8, 74, 6, 3); disc(sx + 8, 74, 5, 2); r(sx + 5, 71, 3, 2, 1); }
      break;
    case 'mtntown': {
      const m = ((c % 7) + 7) % 7;
      if (m === 1) {
        r(sx - 1, 40, 34, 6, 3); r(sx, 41, 32, 4, 2);
        r(sx, 46, 32, 26, 3); r(sx + 1, 47, 30, 24, 1);
        for (let y = 51; y < 71; y += 4) r(sx + 1, y, 30, 1, 2);
        r(sx + 13, 60, 6, 11, 3);
        r(sx + 4, 53, 6, 5, 3); r(sx + 5, 54, 4, 3, 0);
      } else if (m === 4) {
        // 체육관
        r(sx, 30, 44, 42, 3);
        r(sx + 1, 31, 42, 40, 1);
        r(sx + 1, 31, 42, 6, 2);
        r(sx + 12, 40, 20, 7, 3); r(sx + 13, 41, 18, 5, 0);
        disc(sx + 22, 43, 2, 3);
        r(sx + 4, 40, 3, 31, 2); r(sx + 37, 40, 3, 31, 2);
        r(sx + 17, 58, 10, 14, 3);
      } else if (m === 6) {
        roundTree(sx + 8, 54);
      }
      break;
    }
  }
  // 지역 경계 표지판
  if (c > 0 && (c * 16) % AREA_LEN === 0) {
    r(sx + 3, 60, 12, 8, 3);
    r(sx + 4, 61, 10, 6, 0);
    r(sx + 6, 63, 6, 1, 1);
    r(sx + 6, 65, 4, 1, 1);
    r(sx + 8, 68, 2, 12, 3);
  }
}

/* ═════════ 장면 ═════════ */
function drawScene(t, rt) {
  const st = getState(t);
  const camX = Math.floor(st.wx) - RED_X;
  const cols = [];
  for (let c = Math.floor(camX / 16); c <= Math.floor((camX + W) / 16); c++) {
    const k = { c, sx: c * 16 - camX, type: AREAS[areaAt(c * 16 + 8)].type };
    cols.push(k);
    drawBg(k.type, c, k.sx, rt);
  }
  for (const k of cols) drawObj(k.type, k.c, k.sx, rt);

  const walking = running && !st.cur;
  const frame = Math.floor(st.wx / 6) % 2;
  const atSea = AREAS[st.area].type === 'sea';
  const seaBob = i => (atSea ? Math.round(Math.sin(rt * 4 + i)) : 0);
  const { cur, phase } = st;

  // 동료 포켓몬들
  st.party.forEach((m, i) => {
    const cx = RED_X - GAP * (i + 1);
    let sprite = LINES[m.line].sprites[m.stage];
    let sil = false;
    if (cur && cur.type === 'evo' && cur.line === m.line && phase < 3) {
      const tog = Math.floor(phase * phase * 1.8) % 2;
      sprite = LINES[m.line].sprites[cur.from + tog];
      sil = true;
    }
    if (cur && cur.type === 'meet' && cur.line === m.line && phase < 3 && Math.floor(phase * 8) % 2) return;
    const flying = m.line === 'caterpie' && m.stage === 2;
    const bob = walking ? (frame + i) % 2 : 0;
    const lift = flying ? 6 + Math.round(Math.sin(rt * 5 + i) * 2) : 0;
    drawSprite(sprite, cx, GROUND - bob - lift + seaBob(i + 1), sil);

    if (cur && cur.type === 'evo' && cur.line === m.line && phase >= 3 && phase < 4) {
      for (let k = 0; k < 6; k++) {
        const a = k / 6 * Math.PI * 2 + phase * 3;
        const px = Math.round(cx + Math.cos(a) * 12), py = Math.round(GROUND - 9 + Math.sin(a) * 10);
        r(px - 1, py, 3, 1, 3); r(px, py - 1, 1, 3, 3);
      }
    }
  });

  // 레드
  drawSprite(walking && frame ? RED_B : RED_A, RED_X, GROUND + seaBob(0));

  // 야생 포켓몬 등장
  if (cur && cur.type === 'meet' && phase < 2) {
    const hop = Math.abs(Math.round(Math.sin(phase * 9) * 3));
    drawSprite(LINES[cur.line].sprites[0], 146, GROUND - hop);
    if (phase < 1.3) {
      const b = GROUND - 30;
      r(RED_X - 3, b, 7, 10, 3);
      r(RED_X - 2, b + 1, 5, 8, 0);
      r(RED_X, b + 2, 1, 4, 3);
      r(RED_X, b + 7, 1, 1, 3);
    }
  }

  // 바다에서는 물결이 발을 덮는다
  for (const k of cols) {
    if (k.type !== 'sea') continue;
    r(k.sx, 89, 16, 11, 1);
    r(k.sx, 89, 16, 1, 2);
    r(k.sx + (Math.floor(rt * 6) + k.c * 5) % 13, 89, 3, 1, 0);
    r(k.sx + (Math.floor(rt * 4) + k.c * 3) % 14, 94, 2, 1, 2);
  }

  return st;
}

function drawBox(t) {
  r(0, 100, 160, 44, 0);
  r(1, 101, 158, 1, 3); r(1, 142, 158, 1, 3);
  r(1, 101, 1, 42, 3); r(158, 101, 1, 42, 3);
  r(3, 103, 154, 1, 2); r(3, 140, 154, 1, 2);
  r(3, 103, 1, 38, 2); r(156, 103, 1, 38, 2);
  const str = formatTime(t * 1000);
  drawText(str, Math.round((W - textWidth(str, 2)) / 2), 106, 2, 3);
  if (running && Math.floor(performance.now() / 400) % 2) {
    r(148, 133, 5, 1, 3); r(149, 134, 3, 1, 3); r(150, 135, 1, 1, 3);
  }
}

function messageFor(st, t) {
  if (toast && performance.now() < toast.until) return toast.text;
  const { cur, phase } = st;
  if (cur && cur.type === 'meet') {
    const name = LINES[cur.line].names[0];
    return phase < 2 ? `야생의 ${josa(name, '이/가')} 나타났다!` : `${josa(name, '이/가')} 동료가 되었다!`;
  }
  if (cur && cur.type === 'evo') {
    const from = LINES[cur.line].names[cur.from], to = LINES[cur.line].names[cur.from + 1];
    return phase < 3 ? `어라…!? ${from}의 상태가…!` : `${josa(from, '은/는')} ${josa(to, '으로/로')} 진화했다!`;
  }
  if (!running) return t === 0 ? '레드의 모험이 시작된다! A를 눌러 출발!' : '잠깐 쉬어 가자… A 계속 · SELECT 리셋';
  if (st.area === 0 && st.loop > 0) return '태초마을로 돌아왔다! 다시 출발!';
  return AREAS[st.area].msg;
}

function showSign(name) {
  signEl.textContent = name;
  signEl.classList.add('show');
  clearTimeout(signTimer);
  signTimer = setTimeout(() => signEl.classList.remove('show'), 2600);
}

function applyPalette() {
  PALETTES[pal].c.forEach((c, i) => screenEl.style.setProperty('--c' + i, c));
}

function render() {
  const t = now() / 1000;
  const rt = performance.now() / 1000;
  const st = drawScene(t, rt);
  drawBox(t);

  const text = messageFor(st, t);
  if (text !== lastMsg) { msgEl.textContent = text; lastMsg = text; }
  if (st.area !== lastArea) { lastArea = st.area; showSign(AREAS[st.area].name); }

  requestAnimationFrame(render);
}

/* ═════════ 조작 ═════════ */
function say(text, ms = 1600) {
  toast = { text, until: performance.now() + ms };
}

function startStop() {
  if (running) {
    elapsed = now();
    running = false;
  } else {
    startTime = performance.now();
    running = true;
  }
  ledEl.classList.toggle('on', running);
}

function lap() {
  const total = now();
  laps.push({ lap: total - lapStart, total, place: AREAS[getState(total / 1000).area].name });
  lapStart = total;
  say(`랩 ${laps.length} 기록! ${formatTime(laps.at(-1).lap)}`);
  renderLaps();
}

function reset() {
  if (running) { say('달리는 중엔 리셋할 수 없어!'); return; }
  elapsed = 0;
  lapStart = 0;
  laps = [];
  schedule = buildSchedule();
  toast = null;
  lastArea = -1;
  renderLaps();
}

function renderLaps() {
  lapList.innerHTML = '';
  emptyEl.hidden = laps.length > 0;
  laps.slice().reverse().forEach((l, idx) => {
    const n = laps.length - idx;
    const li = document.createElement('li');
    li.innerHTML = `<span>No.${n}</span><span>${formatTime(l.lap)} <small>/ ${formatTime(l.total)}</small></span><small></small>`;
    li.lastChild.textContent = l.place;
    lapList.appendChild(li);
  });
}

function press(key) {
  switch (key) {
    case 'a':
    case 'start': startStop(); break;
    case 'b': running ? lap() : (elapsed > 0 && reset()); break;
    case 'select': reset(); break;
    case 'left':
    case 'right':
      pal = (pal + (key === 'right' ? 1 : PALETTES.length - 1)) % PALETTES.length;
      applyPalette();
      say(`화면 색상: ${PALETTES[pal].name}`, 1200);
      break;
  }
}

document.querySelectorAll('[data-key]').forEach(btn => {
  btn.addEventListener('click', () => press(btn.dataset.key));
});

const KEYMAP = {
  Space: 'a', KeyZ: 'a', Enter: 'start', KeyX: 'b', KeyL: 'b',
  KeyR: 'select', Backspace: 'select', ArrowLeft: 'left', ArrowRight: 'right',
  ArrowUp: 'up', ArrowDown: 'down',
};
document.addEventListener('keydown', e => {
  const key = KEYMAP[e.code];
  if (!key) return;
  e.preventDefault();
  if (e.repeat) return;
  const btn = document.querySelector(`[data-key="${key}"]`);
  btn.classList.add('pressed');
  setTimeout(() => btn.classList.remove('pressed'), 130);
  press(key);
});

applyPalette();
renderLaps();
requestAnimationFrame(render);
</script>
</body>
</html>
